openapi: 3.2.0
info:
    title: 'Rotor API'
    version: 1.0.0
    description: |
        Для доступа к данным нужен API-ключ, который можно получить через авторизацию или на странице Мои данные.

        Лимиты запросов: 120 в минуту на все методы, 10 в минуту на авторизацию.
        Остаток лимита — в заголовках X-RateLimit-Limit и X-RateLimit-Remaining, при превышении приходит 429 и Retry-After.
security:
    -
        BearerToken: {  }
components:
    securitySchemes:
        BearerToken:
            type: http
            scheme: bearer
            description: 'Передайте API-ключ в заголовке: Authorization: Bearer {token}'
    parameters:
        Sort:
            name: sort
            in: query
            schema:
                type: string
                enum:
                    - date
                    - name
                    - title
                    - price
                    - visits
                    - loads
                    - rating
                    - comments
                default: date
            description: 'Поле сортировки; набор зависит от раздела, неизвестное значение игнорируется'
        CategoryId:
            name: category_id
            in: query
            schema:
                type: integer
            description: 'Ограничить выборку категорией'
        PerPage:
            name: per_page
            in: query
            schema:
                type: integer
                default: 10
                minimum: 1
                maximum: 100
            description: 'Количество элементов на странице'
        Page:
            name: page
            in: query
            schema:
                type: integer
                default: 1
                minimum: 1
            description: 'Номер страницы'
        Order:
            name: order
            in: query
            schema:
                type: string
                enum:
                    - asc
                    - desc
                default: desc
            description: 'Порядок сортировки'
    schemas:
        UserProfile:
            type: object
            properties:
                login:
                    type: string
                name:
                    type: string
                level:
                    type: string
                    enum:
                        - boss
                        - admin
                        - moder
                        - editor
                        - user
                        - pended
                        - banned
                country:
                    type:
                        - string
                        - null
                city:
                    type:
                        - string
                        - null
                info:
                    type:
                        - string
                        - null
                site:
                    type:
                        - string
                        - null
                gender:
                    type:
                        - string
                        - null
                    enum:
                        - male
                        - female
                        - null
                birthday:
                    type:
                        - string
                        - null
                themes:
                    type: string
                    description: 'Текущая тема оформления'
                point:
                    type: integer
                    description: Баллы
                money:
                    type: integer
                    description: Монеты
                status:
                    type:
                        - string
                        - null
                color:
                    type:
                        - string
                        - null
                    description: 'Цвет имени пользователя'
                avatar:
                    type:
                        - string
                        - null
                    format: uri
                picture:
                    type:
                        - string
                        - null
                    format: uri
                rating:
                    type: integer
                language:
                    type: string
                timezone:
                    type: string
                lastlogin:
                    type:
                        - string
                        - null
                    format: date-time
                email:
                    type:
                        - string
                        - null
                    format: email
                phone:
                    type:
                        - string
                        - null
                allprivat:
                    type: integer
                    description: 'Всего приватных сообщений'
                newprivat:
                    type: integer
                    description: 'Непрочитанных приватных сообщений'
        Category:
            type: object
            description: 'Категория раздела с подкатегориями'
            properties:
                id:
                    type: integer
                parent_id:
                    type: integer
                parent:
                    description: 'Родительская категория; null у корневой, отсутствует, если связь не загружалась'
                    oneOf:
                        - $ref: '#/components/schemas/Category'
                        - type: 'null'
                name:
                    type: string
                url:
                    type: string
                    format: uri
                closed:
                    type: boolean
                articles_count:
                    type: integer
                    description: 'Только у категорий блогов'
                downs_count:
                    type: integer
                    description: 'Только у категорий загрузок'
                items_count:
                    type: integer
                    description: 'Только у категорий объявлений'
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/Category'
        Comment:
            type: object
            description: 'Комментарий записи. Комментарии приходят лентой по дате: ответ помечен parent_id и несёт краткий контекст родителя в parent'
            properties:
                id:
                    type: integer
                parent_id:
                    type:
                        - integer
                        - 'null'
                    description: 'Комментарий, на который отвечают'
                depth:
                    type: integer
                    description: 'Глубина вложенности ответа'
                parent:
                    type:
                        - object
                        - 'null'
                    description: 'Комментарий, на который отвечают — для строки «в ответ @login». null у корневых и у ответов на удалённые'
                    properties:
                        id:
                            type: integer
                        login:
                            type:
                                - string
                                - 'null'
                        excerpt:
                            type:
                                - string
                                - 'null'
                            description: 'Первые 100 символов текста без разметки'
                deleted:
                    type: boolean
                    description: 'Удалённый комментарий: text и user пустые, запись остаётся заглушкой, чтобы ветка ответов не рвалась'
                text:
                    type:
                        - string
                        - 'null'
                rating:
                    type: integer
                vote:
                    type: object
                    description: 'Цель голосования для POST /rating'
                    properties:
                        type:
                            type: string
                        id:
                            type: integer
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                            description: 'Голос текущего пользователя, null без токена или если не голосовал'
                        own:
                            type: boolean
                            description: 'Свой комментарий — голосовать нельзя'
                user:
                    oneOf:
                        - $ref: '#/components/schemas/Author'
                        - type: 'null'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
        Photo:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type:
                        - string
                        - 'null'
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                closed:
                    type: boolean
                    description: 'Комментирование закрыто'
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    description: 'Все снимки записи, включая вставленные в текст'
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Item:
            type: object
            description: 'Объявление. Комментариев и рейтинга у раздела нет'
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                category_id:
                    type: integer
                category:
                    $ref: '#/components/schemas/Category'
                price:
                    type: integer
                currency:
                    type: string
                    description: 'Валюта сайта из настроек'
                phone:
                    type:
                        - string
                        - 'null'
                active:
                    type: boolean
                visits:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                    description: 'Срок публикации'
                expired:
                    type: boolean
                    description: 'Срок истёк: объявление пропадает из списков и ленты'
        Down:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                category_id:
                    type: integer
                category:
                    $ref: '#/components/schemas/Category'
                active:
                    type: boolean
                    description: 'Проверена администрацией'
                downloads:
                    type: integer
                    description: 'Счётчик скачиваний'
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    description: 'Скриншоты и видео'
                    items:
                        $ref: '#/components/schemas/File'
                can_download:
                    type: boolean
                    description: 'Скачивание разрешено текущему запросу; false — гостям запрещено настройкой'
                files:
                    type: array
                    description: 'Файлы дистрибутива. Прямого пути нет: качать только по download_url'
                    items:
                        type: object
                        properties:
                            id: { type: integer }
                            name: { type: string }
                            size: { type: integer }
                            extension: { type: string }
                            mime_type: { type: string }
                            download_url:
                                type:
                                    - string
                                    - 'null'
                                format: uri
                                description: 'null — скачивание запрещено'
                            archive_url:
                                type:
                                    - string
                                    - 'null'
                                format: uri
                                description: 'Просмотр содержимого zip, у остальных файлов null'
                links:
                    type: array
                    description: 'Внешние ссылки на скачивание'
                    items:
                        type: object
                        properties:
                            name: { type: string }
                            download_url:
                                type:
                                    - string
                                    - 'null'
                                format: uri
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Article:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                slug:
                    type: string
                    description: 'Слаг из ссылки, начинается с id'
                category_id:
                    type: integer
                category:
                    $ref: '#/components/schemas/Category'
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                visits:
                    type: integer
                comments_count:
                    type: integer
                tags:
                    type: array
                    items:
                        type: object
                        properties:
                            name: { type: string }
                            url: { type: string, format: uri }
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        News:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                closed:
                    type: boolean
                    description: 'Комментирование закрыто'
                top:
                    type: boolean
                    description: 'Закреплена вверху списка'
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Offer:
            type: object
            properties:
                id:
                    type: integer
                type:
                    type: string
                    enum:
                        - offer
                        - issue
                status:
                    type: string
                    enum:
                        - wait
                        - process
                        - done
                        - cancel
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                closed:
                    type: boolean
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                reply:
                    type:
                        - object
                        - 'null'
                    description: 'Официальный ответ администрации, null — ответа ещё нет'
                    properties:
                        text: { type: string }
                        user: { $ref: '#/components/schemas/Author' }
                        answered_at: { type: string, format: date-time }
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Author:
            type: object
            description: 'Автор записи в списках — подписи хватает аватара и ника'
            properties:
                login:
                    type: string
                name:
                    type:
                        - string
                        - 'null'
                level:
                    type: string
                color:
                    type:
                        - string
                        - 'null'
                    description: 'Цвет ника'
                avatar:
                    type:
                        - string
                        - 'null'
                    format: uri
                status:
                    type:
                        - string
                        - 'null'
                    description: 'HTML статуса пользователя'
        User:
            type: object
            properties:
                login:
                    type: string
                name:
                    type: string
                level:
                    type: string
                country:
                    type:
                        - string
                        - null
                city:
                    type:
                        - string
                        - null
                info:
                    type:
                        - string
                        - null
                site:
                    type:
                        - string
                        - null
                gender:
                    type:
                        - string
                        - null
                birthday:
                    type:
                        - string
                        - null
                themes:
                    type: string
                point:
                    type: integer
                money:
                    type: integer
                status:
                    type:
                        - string
                        - null
                color:
                    type:
                        - string
                        - null
                avatar:
                    type:
                        - string
                        - null
                    format: uri
                picture:
                    type:
                        - string
                        - null
                    format: uri
                rating:
                    type: integer
                language:
                    type: string
                timezone:
                    type: string
                lastlogin:
                    type:
                        - string
                        - null
                    format: date-time
        Dialogue:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                    description: 'Логин собеседника'
                name:
                    type: string
                    description: 'Имя собеседника'
                text:
                    type: string
                    description: 'Текст последнего сообщения'
                type:
                    type: string
                    enum:
                        - in
                        - out
                    description: 'Направление: in — входящее, out — исходящее'
                all_reading:
                    type: boolean
                    description: 'Все сообщения в диалоге прочитаны'
                recipient_read:
                    type: boolean
                    description: 'Получатель прочитал последнее сообщение'
                can_reply:
                    type: boolean
                    description: 'Можно ли ответить (false для системных сообщений)'
                created_at:
                    type: string
                    format: date-time
                    description: 'Дата последнего сообщения'
        Message:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                    description: 'Логин отправителя'
                name:
                    type: string
                    description: 'Имя отправителя'
                text:
                    type: string
                type:
                    type: string
                    enum:
                        - in
                        - out
                    description: 'Направление: in — входящее, out — исходящее'
                recipient_read:
                    type: boolean
                    description: 'Получатель прочитал это сообщение'
                created_at:
                    type: string
                    format: date-time
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
        Forum:
            type: object
            properties:
                id:
                    type: integer
                parent_id:
                    type: integer
                    description: 'ID родительского раздела (0 — корневой)'
                parent:
                    description: 'Родительский раздел, приходит только когда связь загружена; null у корневых'
                    oneOf:
                        -
                            $ref: '#/components/schemas/Forum'
                        -
                            type: 'null'
                sort:
                    type: integer
                    description: 'Порядок сортировки'
                title:
                    type: string
                    description: 'Название форума'
                description:
                    type:
                        - string
                        - null
                    description: 'Короткое описание форума'
                closed:
                    type: boolean
                    description: 'Раздел закрыт для новых тем'
                count_topics:
                    type: integer
                count_posts:
                    type: integer
                last_topic_id:
                    type:
                        - integer
                        - null
                last_topic_title:
                    type:
                        - string
                        - null
                last_post_user_login:
                    type:
                        - string
                        - null
                last_post_user_name:
                    type:
                        - string
                        - null
                last_post_at:
                    type:
                        - string
                        - null
                    format: date-time
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/Forum'
                    description: 'Вложенные подразделы'
        Topic:
            type: object
            properties:
                id:
                    type: integer
                forum_id:
                    type: integer
                    description: 'ID раздела, в котором лежит тема'
                forum:
                    description: 'Раздел темы, приходит в GET /topics/{id} (в списке тем раздела не дублируется)'
                    oneOf:
                        -
                            $ref: '#/components/schemas/Forum'
                        -
                            type: 'null'
                title:
                    type: string
                login:
                    type: string
                name:
                    type: string
                closed:
                    type: integer
                    description: 'Тема закрыта'
                locked:
                    type: integer
                    description: 'Тема закреплена вверху'
                count_posts:
                    type: integer
                visits:
                    type: integer
                moderators:
                    type:
                        - string
                        - null
                    description: 'Список модераторов темы'
                note:
                    type:
                        - string
                        - null
                    description: 'Примечание модератора'
                last_post_id:
                    type:
                        - integer
                        - null
                last_post_user_login:
                    type:
                        - string
                        - null
                last_post_user_name:
                    type:
                        - string
                        - null
                close_user_id:
                    type:
                        - integer
                        - null
                    description: 'ID пользователя, закрывшего тему'
                updated_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
        Post:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                text:
                    type: string
                rating:
                    type: integer
                updated_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
        NewMessage:
            type: object
            properties:
                login:
                    type: string
                name:
                    type: string
                count:
                    type: integer
                    description: 'Количество непрочитанных сообщений от этого пользователя'
                last_message_at:
                    type: string
                    format: date-time
        File:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                path:
                    type: string
                    format: uri
                size:
                    type: integer
                extension:
                    type: string
                mime_type:
                    type: string
                is_image:
                    type: boolean
                is_audio:
                    type: boolean
                is_video:
                    type: boolean
        SearchItem:
            type: object
            properties:
                type:
                    type: string
                    description: 'Тип найденной записи (comments, users, news, topics и т.д.)'
                id:
                    type: integer
                section:
                    type:
                        - string
                        - 'null'
                    description: 'Название раздела'
                title:
                    type:
                        - string
                        - 'null'
                    description: 'Заголовок записи; у пользователя — логин, у комментария — заголовок записи, к которой он оставлен'
                url:
                    type:
                        - string
                        - 'null'
                    format: uri
                breadcrumbs:
                    type: array
                    description: 'Путь до записи от корня раздела'
                    items:
                        type: object
                        properties:
                            title:
                                type: string
                            url:
                                type: string
                                format: uri
                text:
                    type:
                        - string
                        - 'null'
                    description: 'HTML текста записи'
                user:
                    oneOf:
                        -
                            $ref: '#/components/schemas/Author'
                        -
                            type: 'null'
                created_at:
                    type: string
                    format: date-time
        FeedItem:
            type: object
            properties:
                type:
                    type: string
                    description: 'Тип записи (comments, news, topics, articles и т.д.)'
                id:
                    type: integer
                section:
                    type:
                        - string
                        - 'null'
                    description: 'Название раздела'
                title:
                    type:
                        - string
                        - 'null'
                url:
                    type:
                        - string
                        - 'null'
                    format: uri
                breadcrumbs:
                    type: array
                    description: 'Путь до записи от корня раздела, пустой массив — раздел не указан'
                    items:
                        type: object
                        properties:
                            title:
                                type: string
                            url:
                                type: string
                                format: uri
                text:
                    type:
                        - string
                        - 'null'
                    description: 'HTML текста записи'
                rating:
                    type:
                        - integer
                        - 'null'
                vote:
                    type:
                        - object
                        - 'null'
                    description: 'Цель голосования, null — тип не поддерживает рейтинг'
                    properties:
                        type:
                            type: string
                            description: 'Тип для POST /rating (у темы форума — последнее сообщение)'
                        id:
                            type: integer
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                            description: 'Голос текущего пользователя, null без токена или если не голосовал'
                        own:
                            type: boolean
                            description: 'Своя запись — голосовать нельзя'
                comments_count:
                    type:
                        - integer
                        - 'null'
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    description: 'Картинки и видео для галереи, кроме вставленных в текст'
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    description: 'Остальные вложения — документы, архивы, аудио'
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                relate:
                    type: object
                    description: 'Только при type=comments: запись, к которой оставлен комментарий'
                    properties:
                        type:
                            type: string
                        id:
                            type: integer
                        title:
                            type:
                                - string
                                - 'null'
                        url:
                            type:
                                - string
                                - 'null'
                            format: uri
                price:
                    type:
                        - number
                        - 'null'
                    description: 'Только при type=items (объявления): цена, валюта — в настройке currency'
                phone:
                    type:
                        - string
                        - 'null'
                    description: 'Только при type=items (объявления): телефон продавца'
                offer_type:
                    type: string
                    enum:
                        - offer
                        - issue
                    description: 'Только при type=offers: предложение или проблема'
                status:
                    type: string
                    enum:
                        - wait
                        - process
                        - done
                        - cancel
                    description: 'Только при type=offers: статус обработки'
            additionalProperties: true
            description: |
                Набор полей зависит от type: базовые поля приходят всегда, дополнительные — только у своего типа записи
                (relate у комментариев, price и phone у объявлений, offer_type и status у предложений).
                Сторонний модуль может добавить собственные поля, поэтому неизвестные ключи игнорируйте, а не считайте ошибкой.
        PaginationLinks:
            type: object
            properties:
                first:
                    type: string
                    format: uri
                last:
                    type: string
                    format: uri
                prev:
                    type:
                        - string
                        - null
                    format: uri
                next:
                    type:
                        - string
                        - null
                    format: uri
        SimplePaginationLinks:
            type: object
            description: 'last всегда null — общее число страниц не вычисляется'
            properties:
                first:
                    type: string
                    format: uri
                last:
                    type: 'null'
                prev:
                    type:
                        - string
                        - 'null'
                    format: uri
                next:
                    type:
                        - string
                        - 'null'
                    format: uri
        SimplePaginationMeta:
            type: object
            description: 'Упрощённая пагинация: общее число записей не считается, следующая страница определяется по links.next'
            properties:
                current_page:
                    type: integer
                current_page_url:
                    type: string
                    format: uri
                from:
                    type:
                        - integer
                        - 'null'
                path:
                    type: string
                    format: uri
                per_page:
                    type: integer
                to:
                    type:
                        - integer
                        - 'null'
        PaginationMeta:
            type: object
            properties:
                current_page:
                    type: integer
                from:
                    type:
                        - integer
                        - null
                last_page:
                    type: integer
                per_page:
                    type: integer
                to:
                    type:
                        - integer
                        - null
                total:
                    type: integer
paths:
    /auth:
        post:
            tags:
                - Авторизация
            summary: 'Получить API-токен'
            operationId: auth
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - login
                                - password
                            properties:
                                login:
                                    type: string
                                    description: 'Логин или email'
                                password:
                                    type: string
                                    format: password
                                    description: Пароль
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    token:
                                        type: string
                                        description: 'API-токен для использования в заголовке Authorization: Bearer {token}'
                401:
                    description: 'Неверный логин или пароль'
                403:
                    description: 'Пользователь заблокирован'
                422:
                    description: 'Ошибка валидации'
                429:
                    description: 'Превышен лимит попыток авторизации (10 в минуту с одного ip)'
    /stats:
        get:
            tags:
                - Конфигурация
            summary: 'Статистика сайта'
            description: |
                Токен не обязателен. С токеном добавляется блок user — непрочитанные сообщения, баллы и деньги.

                Счётчики разделов приходят от модулей, поэтому набор ключей в sections зависит от сборки.
                Значения кешируются на пять минут, онлайн — на минуту.
            operationId: getStats
            security:
                -
                    BearerToken: {  }
                - {}
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    users:
                                        type: object
                                        properties:
                                            total: { type: integer }
                                            today:
                                                type: integer
                                                description: 'Зарегистрировались за сутки'
                                            admins: { type: integer }
                                    online:
                                        type: object
                                        properties:
                                            users: { type: integer }
                                            guests: { type: integer }
                                            total: { type: integer }
                                    sections:
                                        type: object
                                        description: 'Счётчики разделов: ключ — тип раздела, значение — количество записей'
                                        additionalProperties: { type: integer }
                                    user:
                                        type: object
                                        description: 'Только с токеном'
                                        properties:
                                            new_messages: { type: integer }
                                            point: { type: integer }
                                            money: { type: integer }
    /captcha:
        get:
            tags:
                - Капча
            summary: 'Задание капчи'
            description: |
                Нужна везде, где форма защищена от ботов: регистрация, восстановление пароля,
                повторное письмо с подтверждением. Тип капчи задаётся настройками сайта.

                Для graphical и animated приходит картинка в data-URI и одноразовый ключ:
                его вместе с разгадкой (protect) нужно отправить с формой, срок жизни — expires_in секунд.
                Ключ одноразовый — на каждую форму берите новое задание.

                Для recaptcha_v2 и recaptcha_v3 приходит site_key, а в поле protect уходит токен от Google.
                Тип none означает, что капча отключена и поля можно не отправлять.
            operationId: getCaptcha
            security: []
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    type:
                                        type: string
                                        enum:
                                            - graphical
                                            - animated
                                            - recaptcha_v2
                                            - recaptcha_v3
                                            - none
                                    key:
                                        type: string
                                        description: 'Одноразовый ключ задания (только для картинки)'
                                    image:
                                        type: string
                                        description: 'Картинка data-URI (только для картинки)'
                                    expires_in:
                                        type: integer
                                        description: 'Срок жизни задания в секундах'
                                    site_key:
                                        type: string
                                        description: 'Публичный ключ reCAPTCHA'
    /register:
        post:
            tags:
                - Авторизация
            summary: Регистрация
            description: |
                Возвращает готовый токен — отдельно авторизовываться не нужно.

                Если на сайте включено подтверждение регистрации, аккаунт приходит с pending: true:
                до перехода по ссылке из письма писать на сайте нельзя, повторить письмо можно через /user/verify.
            operationId: register
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - login
                                - password
                                - email
                            properties:
                                login:
                                    type: string
                                    minLength: 3
                                    maxLength: 20
                                    pattern: '^[a-z0-9][a-z0-9\-]+$'
                                password:
                                    type: string
                                    format: password
                                    minLength: 6
                                    maxLength: 20
                                password2:
                                    type: string
                                    format: password
                                    description: 'Повтор пароля, по умолчанию равен password'
                                email:
                                    type: string
                                    format: email
                                gender:
                                    type: string
                                    enum: ['М', 'Ж']
                                captcha_key:
                                    type: string
                                    description: 'Ключ задания из /captcha'
                                protect:
                                    type: string
                                    description: 'Разгадка капчи или токен reCAPTCHA'
            responses:
                201:
                    description: 'Аккаунт создан'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    token: { type: string }
                                    pending:
                                        type: boolean
                                        description: 'Аккаунт ждёт подтверждения по почте'
                                    user: { $ref: '#/components/schemas/UserProfile' }
                403:
                    description: 'Регистрация закрыта'
                422:
                    description: 'Ошибка валидации'
                429:
                    description: 'Превышен лимит попыток (10 в минуту с одного ip)'
    /recovery:
        post:
            tags:
                - Авторизация
            summary: 'Восстановление пароля'
            description: 'Отправляет на почту ссылку восстановления. Ссылка открывается на сайте, новый пароль приходит письмом. Повторная заявка принимается через час.'
            operationId: recovery
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - user
                            properties:
                                user:
                                    type: string
                                    description: 'Логин или email'
                                captcha_key: { type: string }
                                protect: { type: string }
            responses:
                200:
                    description: 'Письмо отправлено'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Ошибка валидации, пользователь не найден или заявка уже отправлена'
                429:
                    description: 'Превышен лимит попыток (10 в минуту с одного ip)'
    /feed:
        get:
            tags:
                - Лента
            summary: 'Лента последних записей сайта'
            description: 'Токен не обязателен. С токеном в каждом элементе приходит голос текущего пользователя (vote.value)'
            operationId: getFeed
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    $ref: '#/components/parameters/Page'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/FeedItem'
                                    links:
                                        $ref: '#/components/schemas/SimplePaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/SimplePaginationMeta'
                429:
                    description: 'Превышен общий лимит запросов'
    /search:
        get:
            tags:
                - Поиск
            summary: 'Полнотекстовый поиск по сайту'
            description: |
                Ищет по записям разделов, комментариям и пользователям. Токен не нужен — выдача не зависит от пользователя.

                Слова короче трёх символов отбрасываются, из оставшихся собирается запрос;
                если после отсева ничего не осталось — 422.
            operationId: getSearch
            security: []
            parameters:
                -
                    name: query
                    in: query
                    required: true
                    schema:
                        type: string
                        minLength: 3
                        maxLength: 64
                    description: 'Поисковый запрос (синоним — q)'
                -
                    name: type
                    in: query
                    schema:
                        type: string
                    description: 'Ограничить поиск разделом; допустимые значения приходят в /config (types.search), неизвестное значение игнорируется'
                -
                    name: sort
                    in: query
                    schema:
                        type: string
                        enum:
                            - relevance
                            - date
                            - date_asc
                        default: relevance
                    description: 'Сортировка выдачи'
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/SearchItem'
                                    links:
                                        $ref: '#/components/schemas/PaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/PaginationMeta'
                                    query:
                                        type: string
                                        description: 'Запрос после очистки от пунктуации'
                                    type:
                                        type:
                                            - string
                                            - 'null'
                                    sort:
                                        type: string
                422:
                    description: 'Слишком короткий или слишком длинный запрос'
                429:
                    description: 'Превышен общий лимит запросов'
    /comments/{id}:
        get:
            tags:
                - Комментарии
            summary: 'Комментарий по id'
            description: 'Токен не нужен. Удалённый комментарий приходит заглушкой с deleted: true'
            operationId: getComment
            security: []
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Comment'
                404:
                    description: 'Комментарий не найден'
                429:
                    description: 'Превышен общий лимит запросов'
        patch:
            tags:
                - Комментарии
            summary: 'Редактирование своего комментария'
            description: 'Править можно только свой комментарий и только в течение 10 минут после публикации. Требует токен'
            operationId: updateComment
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - text
                            properties:
                                text:
                                    type: string
                                    description: 'Новый текст, длина ограничена настройками comment_text_min и comment_text_max'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    comment:
                                        $ref: '#/components/schemas/Comment'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                404:
                    description: 'Комментарий не найден или принадлежит другому пользователю'
                422:
                    description: 'Время редактирования истекло, комментарии закрыты или текст не прошёл проверку'
                429:
                    description: 'Превышен общий лимит запросов'
        delete:
            tags:
                - Комментарии
            summary: 'Удаление комментария'
            description: 'Только для администрации, как и на сайте. Комментарий с ответами удаляется мягко и остаётся заглушкой'
            operationId: deleteComment
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    soft_deleted:
                                        type: boolean
                                        description: 'true — остался заглушкой, потому что на него отвечали'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                403:
                    description: 'Недостаточно прав'
                404:
                    description: 'Комментарий не найден'
                429:
                    description: 'Превышен общий лимит запросов'
    /comments:
        post:
            tags:
                - Комментарии
            summary: 'Добавление комментария к записи любого раздела'
            description: |
                Требует токен. Тип и id записи берутся из ответа раздела или из элемента ленты.

                Файлы можно приложить двумя способами: передать их прямо в этом запросе (multipart, поле files[])
                или заранее загрузить через POST /files с type=comments и id=0 — такие файлы привяжутся к комментарию автоматически.
            operationId: createComment
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - type
                                - id
                                - text
                            properties:
                                type:
                                    type: string
                                    description: 'Тип записи (news, articles, downs, photos, offers)'
                                id:
                                    type: integer
                                    description: 'Id записи'
                                text:
                                    type: string
                                parent_id:
                                    type: integer
                                    description: 'Id комментария, на который отвечают; глубже настройки ветка не растёт'
                                files:
                                    type: array
                                    items:
                                        type: string
                                        format: binary
            responses:
                201:
                    description: 'Комментарий добавлен'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    comment:
                                        $ref: '#/components/schemas/Comment'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                404:
                    description: 'Запись не найдена'
                422:
                    description: 'Комментарии закрыты, запись не проверена, антифлуд или текст не прошёл проверку'
                429:
                    description: 'Превышен общий лимит запросов'
    /files:
        get:
            tags:
                - Вложения
            summary: 'Свои вложения'
            description: 'Возвращает файлы текущего пользователя. Без id — загруженные, но ещё не привязанные к записи. Требует токен'
            operationId: getFiles
            parameters:
                -
                    name: type
                    in: query
                    required: true
                    schema:
                        type: string
                    description: 'Тип записи (comments, messages, offers, photos, downs)'
                -
                    name: id
                    in: query
                    schema:
                        type: integer
                        default: 0
                    description: 'Id записи; 0 — файлы, ожидающие привязки'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/File'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                422:
                    description: 'Неизвестный тип'
                429:
                    description: 'Превышен общий лимит запросов'
        post:
            tags:
                - Вложения
            summary: 'Загрузка вложения'
            description: |
                Требует токен. Ограничения на размер, количество и расширения приходят в /config.

                id = 0 — запись ещё не создана: файл повиснет за пользователем и привяжется при её сохранении.
            operationId: uploadFile
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - type
                                - file
                            properties:
                                type:
                                    type: string
                                    description: 'Тип записи (comments, messages, offers, photos, downs)'
                                id:
                                    type: integer
                                    default: 0
                                file:
                                    type: string
                                    format: binary
            responses:
                201:
                    description: 'Файл загружен'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    file:
                                        $ref: '#/components/schemas/File'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                422:
                    description: 'Неизвестный тип, превышен лимит файлов, дубликат или файл не прошёл проверку'
                429:
                    description: 'Превышен общий лимит запросов'
    /files/{id}:
        delete:
            tags:
                - Вложения
            summary: 'Удаление вложения'
            description: 'Удалить можно своё вложение (администрация — любое). Требует токен'
            operationId: deleteFile
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - type
                            properties:
                                type:
                                    type: string
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                422:
                    description: 'Неизвестный тип, файл не найден или принадлежит другому пользователю'
                429:
                    description: 'Превышен общий лимит запросов'
    /rating:
        post:
            tags:
                - Голосование
            summary: 'Проголосовать за запись или комментарий'
            description: |
                Общий эндпоинт для всех разделов: тип и id берутся из поля vote любой записи или комментария —
                элемента ленты, записи раздела, поста форума. Требует токен.

                За свои записи голосовать нельзя, повторный голос в ту же сторону не проходит,
                голос в другую сторону отменяет предыдущий.
            operationId: rating
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - type
                                - id
                                - vote
                            properties:
                                type:
                                    type: string
                                    description: 'Тип записи — vote.type из ответа любого раздела'
                                id:
                                    type: integer
                                    description: 'Id записи — vote.id из ответа любого раздела'
                                vote:
                                    type: string
                                    enum:
                                        - +
                                        - '-'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    cancel:
                                        type: boolean
                                        description: 'Голос был отменён (повторное голосование в другую сторону)'
                                    rating:
                                        type: integer
                                        description: 'Рейтинг записи после голосования'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                422:
                    description: 'Голос не принят (свой пост, неверный тип или запись не найдена)'
                429:
                    description: 'Превышен общий лимит запросов'
    /config:
        get:
            tags:
                - Конфигурация
            summary: 'Настройки загрузки файлов и лимиты текста'
            operationId: getConfig
            security: []
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    site:
                                        type: object
                                        properties:
                                            title:
                                                type: string
                                                description: 'Название сайта'
                                            language:
                                                type: string
                                                description: 'Язык по умолчанию'
                                            money_name:
                                                type: string
                                                description: 'Название внутренней валюты'
                                            score_name:
                                                type: string
                                                description: 'Название баллов'
                                            site_closed:
                                                type: boolean
                                                description: 'Сайт закрыт для гостей'
                                            registration_open:
                                                type: boolean
                                                description: 'Регистрация открыта'
                                            invite_only:
                                                type: boolean
                                                description: 'Регистрация только по инвайтам'
                                    upload:
                                        type: object
                                        properties:
                                            max_files:
                                                type: integer
                                                description: 'Максимальное количество файлов за раз'
                                            max_file_size:
                                                type: integer
                                                description: 'Максимальный размер файла в байтах'
                                            extensions:
                                                type: array
                                                items:
                                                    type: string
                                                description: 'Разрешённые расширения файлов'
                                    account:
                                        type: object
                                        description: 'Требования форм регистрации и аккаунта'
                                        properties:
                                            login_min: { type: integer }
                                            login_max: { type: integer }
                                            password_min: { type: integer }
                                            password_max: { type: integer }
                                            captcha_type:
                                                type: string
                                                description: 'Тип капчи, задание приходит в /captcha'
                                            confirm_email:
                                                type: boolean
                                                description: 'Регистрация требует подтверждения по почте'
                                            status_point:
                                                type: integer
                                                description: 'Баллов для смены статуса'
                                            status_money:
                                                type: integer
                                                description: 'Стоимость смены статуса'
                                            color_point:
                                                type: integer
                                                description: 'Баллов для смены цвета'
                                            color_money:
                                                type: integer
                                                description: 'Стоимость смены цвета'
                                    forum:
                                        type: object
                                        properties:
                                            title_min:
                                                type: integer
                                                description: 'Минимальная длина названия темы'
                                            title_max:
                                                type: integer
                                                description: 'Максимальная длина названия темы'
                                            text_min:
                                                type: integer
                                                description: 'Минимальная длина текста поста'
                                            text_max:
                                                type: integer
                                                description: 'Максимальная длина текста поста'
                                    vote:
                                        type: object
                                        properties:
                                            title_min:
                                                type: integer
                                                description: 'Минимальная длина вопроса голосования'
                                            title_max:
                                                type: integer
                                                description: 'Максимальная длина вопроса голосования'
                                            answer_min:
                                                type: integer
                                                description: 'Минимальная длина варианта ответа'
                                            answer_max:
                                                type: integer
                                                description: 'Максимальная длина варианта ответа'
                                            answers_min:
                                                type: integer
                                                description: 'Минимальное количество вариантов'
                                            answers_max:
                                                type: integer
                                                description: 'Максимальное количество вариантов'
                                    message:
                                        type: object
                                        properties:
                                            text_min:
                                                type: integer
                                                description: 'Минимальная длина текста сообщения'
                                            text_max:
                                                type: integer
                                                description: 'Максимальная длина текста сообщения'
                                    types:
                                        type: object
                                        description: 'Допустимые значения параметра type в разных ручках. Набор зависит от включённых модулей'
                                        properties:
                                            search:
                                                type: object
                                                description: 'Разделы поиска: ключ — значение type, значение — название раздела'
                                                additionalProperties:
                                                    type: string
                                            comment:
                                                type: object
                                                description: 'Разделы, принимающие комментарии (POST /comments)'
                                                additionalProperties:
                                                    type: string
                                            rating:
                                                type: array
                                                description: 'Типы, поддерживающие голосование (POST /rating)'
                                                items:
                                                    type: string
                                            media:
                                                type: array
                                                description: 'Типы, принимающие фото и видео (POST /files)'
                                                items:
                                                    type: string
                                            file:
                                                type: array
                                                description: 'Типы, принимающие обычные файлы (POST /files)'
                                                items:
                                                    type: string
                                            complaint:
                                                type: array
                                                description: 'Типы, на которые можно пожаловаться (POST /complaint)'
                                                items:
                                                    type: string
    /user:
        get:
            tags:
                - Пользователи
            summary: 'Профиль текущего пользователя'
            operationId: getUser
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/UserProfile' }
                400:
                    description: 'Api token missing'
                401:
                    description: Unauthorized
        patch:
            tags:
                - Аккаунт
            summary: 'Изменение профиля'
            description: 'Поля профиля, добавленные модулями, принимаются вместе с остальными'
            operationId: updateProfile
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    minLength: 3
                                    maxLength: 20
                                gender:
                                    type: string
                                    enum: ['М', 'Ж']
                                country: { type: string, maxLength: 30 }
                                city: { type: string, maxLength: 50 }
                                phone: { type: string }
                                site: { type: string, format: uri }
                                birthday:
                                    type: string
                                    description: 'Дата рождения в формате дд.мм.гггг'
                                info: { type: string, maxLength: 1000 }
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/UserProfile' }
                422:
                    description: 'Ошибка валидации'
    /user/settings:
        get:
            tags:
                - Аккаунт
            summary: 'Настройки аккаунта'
            description: 'Вместе с текущими значениями приходит список доступных тем, языков и часовых поясов'
            operationId: getSettings
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            themes: { type: string, nullable: true }
                                            language: { type: string }
                                            timezone: { type: integer }
                                            notify_mention: { type: boolean }
                                            notify_reply: { type: boolean }
                                            notify_comment: { type: boolean }
                                            subscribe:
                                                type: boolean
                                                description: 'Подписка на рассылку'
                                    available:
                                        type: object
                                        properties:
                                            themes: { type: array, items: { type: string } }
                                            languages: { type: array, items: { type: string } }
                                            timezones: { type: array, items: { type: integer } }
        patch:
            tags:
                - Аккаунт
            summary: 'Изменение настроек'
            operationId: updateSettings
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - language
                            properties:
                                themes:
                                    type: string
                                    description: 'Тема оформления из available.themes'
                                language: { type: string }
                                timezone: { type: integer, minimum: -12, maximum: 12 }
                                notify_mention: { type: boolean }
                                notify_reply: { type: boolean }
                                notify_comment: { type: boolean }
                                subscribe: { type: boolean }
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Ошибка валидации'
    /user/password:
        post:
            tags:
                - Аккаунт
            summary: 'Смена пароля'
            description: 'Токен остаётся прежним — приложение не разлогинивается'
            operationId: changePassword
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - old_password
                                - new_password
                                - confirm_password
                            properties:
                                old_password: { type: string, format: password }
                                new_password:
                                    type: string
                                    format: password
                                    minLength: 6
                                    maxLength: 20
                                confirm_password: { type: string, format: password }
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Ошибка валидации'
    /user/email:
        post:
            tags:
                - Аккаунт
            summary: 'Заявка на смену почты'
            description: 'Подтверждение уходит письмом на новый адрес, ссылка открывается на сайте. Повторная заявка принимается через час.'
            operationId: changeEmail
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - email
                                - password
                            properties:
                                email: { type: string, format: email }
                                password:
                                    type: string
                                    format: password
                                    description: 'Текущий пароль'
            responses:
                200:
                    description: 'Письмо отправлено'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Ошибка валидации или заявка уже отправлена'
    /user/verify:
        post:
            tags:
                - Аккаунт
            summary: 'Повторное письмо с подтверждением регистрации'
            description: 'Доступно, пока аккаунт не подтверждён. Почту можно заодно изменить, если при регистрации ошиблись.'
            operationId: verifyAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                    format: email
                                    description: 'По умолчанию — текущая почта'
                                captcha_key: { type: string }
                                protect: { type: string }
            responses:
                200:
                    description: 'Письмо отправлено'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                403:
                    description: 'Подтверждение отключено или аккаунт уже подтверждён'
                422:
                    description: 'Ошибка валидации'
    /user/status:
        post:
            tags:
                - Аккаунт
            summary: 'Смена статуса'
            description: 'Стоит баллов и денег по настройкам сайта, пустое значение снимает статус'
            operationId: changeStatus
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    minLength: 3
                                    maxLength: 25
                                    nullable: true
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Не хватает баллов или денег, либо ошибка валидации'
    /user/color:
        post:
            tags:
                - Аккаунт
            summary: 'Смена цвета никнейма'
            operationId: changeColor
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                color:
                                    type: string
                                    pattern: '^#[A-Fa-f0-9]{6}$'
                                    nullable: true
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Не хватает баллов или денег, либо ошибка валидации'
    /user/apikey:
        post:
            tags:
                - Аккаунт
            summary: 'Перевыпуск или удаление токена'
            description: 'После вызова старый токен перестаёт работать: сохраните новый из ответа. С action=delete доступ к API закрывается.'
            operationId: changeApikey
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    type: string
                                    enum:
                                        - create
                                        - change
                                        - delete
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    token:
                                        type: string
                                        nullable: true
                                        description: 'Новый токен, при удалении — null'
    /user/photo:
        post:
            tags:
                - Аккаунт
            summary: 'Загрузка фото и аватара'
            description: 'Аватар нарезается из фото автоматически, старые файлы удаляются'
            operationId: uploadPhoto
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - photo
                            properties:
                                photo:
                                    type: string
                                    format: binary
                                    description: 'Изображение не меньше 100×100'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    avatar: { type: string, format: uri }
                                    picture: { type: string, format: uri }
                422:
                    description: 'Ошибка валидации'
        delete:
            tags:
                - Аккаунт
            summary: 'Удаление фото и аватара'
            operationId: deletePhoto
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                422:
                    description: 'Фото не загружено'
    /users:
        get:
            tags:
                - Пользователи
            summary: 'Рейтинг пользователей'
            description: 'Открыт гостю, как и на сайте'
            operationId: getUsers
            security: []
            parameters:
                -
                    name: type
                    in: query
                    schema:
                        type: string
                        enum:
                            - users
                            - admins
                            - birthdays
                        default: users
                    description: 'Все, администрация или именинники сегодня'
                -
                    name: user
                    in: query
                    schema:
                        type: string
                    description: 'Поиск по логину или имени'
                -
                    name: sort
                    in: query
                    schema:
                        type: string
                        enum:
                            - point
                            - rating
                            - money
                            - created
                            - updated
                        default: point
                -
                    $ref: '#/components/parameters/Order'
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/User' }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
    /users/search:
        get:
            tags:
                - Пользователи
            summary: 'Подсказка логинов для упоминаний'
            description: 'Запрос короче двух символов возвращает пустой список'
            operationId: searchUsers
            security: []
            parameters:
                -
                    name: query
                    in: query
                    required: true
                    schema:
                        type: string
                        minLength: 2
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/Author' }
    /online:
        get:
            tags:
                - Пользователи
            summary: 'Кто сейчас на сайте'
            description: 'Гостей видно только счётчиком: кроме ip о них ничего не известно'
            operationId: getOnline
            security: []
            parameters:
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: '#/components/schemas/Author' }
                                    meta:
                                        type: object
                                        properties:
                                            current_page: { type: integer }
                                            last_page: { type: integer }
                                            per_page: { type: integer }
                                            total: { type: integer }
                                            users:
                                                type: integer
                                                description: 'Пользователей на сайте'
                                            guests:
                                                type: integer
                                                description: 'Гостей на сайте'
    '/users/{login}':
        get:
            tags:
                - Пользователи
            summary: 'Профиль пользователя по логину'
            operationId: getUserByLogin
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/User' }
                404:
                    description: 'Пользователь не найден'
    /dialogues:
        get:
            tags:
                - Сообщения
            summary: 'Список диалогов'
            operationId: getDialogues
            parameters:
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Dialogue' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
    '/talk/{login}':
        get:
            tags:
                - Сообщения
            summary: 'Переписка с пользователем'
            operationId: getTalk
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Message' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
                                    dialogue: { $ref: '#/components/schemas/Dialogue' }
                404:
                    description: 'Пользователь не найден'
        post:
            tags:
                - Сообщения
            summary: 'Отправить сообщение пользователю'
            operationId: createTalk
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - text
                            properties:
                                text:
                                    type: string
                                    description: 'Текст сообщения'
                                'files[]':
                                    type: array
                                    items: { type: string, format: binary }
                                    description: 'Прикреплённые файлы (необязательно)'
            responses:
                201:
                    description: 'Сообщение отправлено'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    data: { $ref: '#/components/schemas/Message' }
                404:
                    description: 'Пользователь не найден'
                422:
                    description: 'Ошибка валидации (флуд, игнор-лист, нельзя себе)'
        delete:
            tags:
                - Сообщения
            summary: 'Удаление переписки'
            description: 'Пока есть непрочитанные сообщения, удалять нельзя — иначе письмо исчезнет, не дойдя до адресата'
            operationId: deleteTalk
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
            responses:
                200:
                    description: 'Переписка удалена'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                404:
                    description: 'Пользователь не найден или переписки нет'
                422:
                    description: 'Есть непрочитанные сообщения'
