            tags:
                - Блоги
            summary: 'Создание статьи'
            description: |
                Требует токен. Файлы прикладываются заранее через POST /files с type=articles и id=0.

                draft оставляет статью черновиком, published_at (только для администрации) откладывает публикацию.
                При включённой модерации статья создаётся скрытой.
            operationId: createArticle
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [category_id, title, text, tags]
                            properties:
                                category_id:
                                    type: integer
                                title:
                                    type: string
                                text:
                                    type: string
                                tags:
                                    type: array
                                    minItems: 1
                                    maxItems: 10
                                    items:
                                        type: string
                                draft:
                                    type: boolean
                                published_at:
                                    type: string
                                    format: date-time
            responses:
                201:
                    description: 'Статья создана'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    article:
                                        $ref: '#/components/schemas/Article'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                422:
                    description: 'Раздел закрыт, категория недоступна, антифлуд или данные не прошли проверку'
