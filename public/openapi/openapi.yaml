openapi: 3.2.0
info:
    title: 'Rotor API'
    version: 1.0.0
    description: |
        Для доступа к данным нужен API-ключ, который можно получить через авторизацию или на странице Мои данные.

        Лимиты запросов: 120 в минуту на все методы, 10 в минуту на авторизацию.
        Остаток лимита — в заголовках X-RateLimit-Limit и X-RateLimit-Remaining, при превышении приходит 429 и Retry-After.
security:
    -
        BearerToken: {  }
components:
    securitySchemes:
        BearerToken:
            type: http
            scheme: bearer
            description: 'Передайте API-ключ в заголовке: Authorization: Bearer {token}'
    parameters:
        Sort:
            name: sort
            in: query
            schema:
                type: string
                enum:
                    - date
                    - name
                    - title
                    - price
                    - visits
                    - loads
                    - rating
                    - comments
                default: date
            description: 'Поле сортировки; набор зависит от раздела, неизвестное значение игнорируется'
        CategoryId:
            name: category_id
            in: query
            schema:
                type: integer
            description: 'Ограничить выборку категорией'
        PerPage:
            name: per_page
            in: query
            schema:
                type: integer
                default: 10
                minimum: 1
                maximum: 100
            description: 'Количество элементов на странице'
        Page:
            name: page
            in: query
            schema:
                type: integer
                default: 1
                minimum: 1
            description: 'Номер страницы'
        Order:
            name: order
            in: query
            schema:
                type: string
                enum:
                    - asc
                    - desc
                default: desc
            description: 'Порядок сортировки'
    schemas:
        UserProfile:
            type: object
            properties:
                login:
                    type: string
                name:
                    type: string
                level:
                    type: string
                    enum:
                        - boss
                        - admin
                        - moder
                        - editor
                        - user
                        - pended
                        - banned
                country:
                    type:
                        - string
                        - null
                city:
                    type:
                        - string
                        - null
                info:
                    type:
                        - string
                        - null
                site:
                    type:
                        - string
                        - null
                gender:
                    type:
                        - string
                        - null
                    enum:
                        - male
                        - female
                        - null
                birthday:
                    type:
                        - string
                        - null
                themes:
                    type: string
                    description: 'Текущая тема оформления'
                point:
                    type: integer
                    description: Баллы
                money:
                    type: integer
                    description: Монеты
                status:
                    type:
                        - string
                        - null
                color:
                    type:
                        - string
                        - null
                    description: 'Цвет имени пользователя'
                avatar:
                    type:
                        - string
                        - null
                    format: uri
                picture:
                    type:
                        - string
                        - null
                    format: uri
                rating:
                    type: integer
                language:
                    type: string
                timezone:
                    type: string
                lastlogin:
                    type:
                        - string
                        - null
                    format: date-time
                email:
                    type:
                        - string
                        - null
                    format: email
                phone:
                    type:
                        - string
                        - null
                allprivat:
                    type: integer
                    description: 'Всего приватных сообщений'
                newprivat:
                    type: integer
                    description: 'Непрочитанных приватных сообщений'
        Category:
            type: object
            description: 'Категория раздела с подкатегориями'
            properties:
                id:
                    type: integer
                parent_id:
                    type: integer
                parent:
                    description: 'Родительская категория; null у корневой, отсутствует, если связь не загружалась'
                    oneOf:
                        - $ref: '#/components/schemas/Category'
                        - type: 'null'
                name:
                    type: string
                url:
                    type: string
                    format: uri
                closed:
                    type: boolean
                articles_count:
                    type: integer
                    description: 'Только у категорий блогов'
                downs_count:
                    type: integer
                    description: 'Только у категорий загрузок'
                items_count:
                    type: integer
                    description: 'Только у категорий объявлений'
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/Category'
        Comment:
            type: object
            description: 'Комментарий записи. Плоский список: ветка ответов собирается по parent_id, depth — глубина вложенности'
            properties:
                id:
                    type: integer
                parent_id:
                    type:
                        - integer
                        - 'null'
                    description: 'Комментарий, на который отвечают'
                depth:
                    type: integer
                deleted:
                    type: boolean
                    description: 'Удалённый комментарий: text и user пустые, запись остаётся заглушкой, чтобы ветка ответов не рвалась'
                text:
                    type:
                        - string
                        - 'null'
                rating:
                    type: integer
                vote:
                    type: object
                    description: 'Цель голосования для POST /rating'
                    properties:
                        type:
                            type: string
                        id:
                            type: integer
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                            description: 'Голос текущего пользователя, null без токена или если не голосовал'
                        own:
                            type: boolean
                            description: 'Свой комментарий — голосовать нельзя'
                user:
                    oneOf:
                        - $ref: '#/components/schemas/Author'
                        - type: 'null'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
        Photo:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type:
                        - string
                        - 'null'
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                closed:
                    type: boolean
                    description: 'Комментирование закрыто'
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    description: 'Все снимки записи, включая вставленные в текст'
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Item:
            type: object
            description: 'Объявление. Комментариев и рейтинга у раздела нет'
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                category_id:
                    type: integer
                category:
                    $ref: '#/components/schemas/Category'
                price:
                    type: integer
                currency:
                    type: string
                    description: 'Валюта сайта из настроек'
                phone:
                    type:
                        - string
                        - 'null'
                active:
                    type: boolean
                visits:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                    description: 'Срок публикации'
                expired:
                    type: boolean
                    description: 'Срок истёк: объявление пропадает из списков и ленты'
        Down:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                category_id:
                    type: integer
                category:
                    $ref: '#/components/schemas/Category'
                active:
                    type: boolean
                    description: 'Проверена администрацией'
                downloads:
                    type: integer
                    description: 'Счётчик скачиваний'
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    description: 'Скриншоты и видео'
                    items:
                        $ref: '#/components/schemas/File'
                can_download:
                    type: boolean
                    description: 'Скачивание разрешено текущему запросу; false — гостям запрещено настройкой'
                files:
                    type: array
                    description: 'Файлы дистрибутива. Прямого пути нет: качать только по download_url'
                    items:
                        type: object
                        properties:
                            id: { type: integer }
                            name: { type: string }
                            size: { type: integer }
                            extension: { type: string }
                            mime_type: { type: string }
                            download_url:
                                type:
                                    - string
                                    - 'null'
                                format: uri
                                description: 'null — скачивание запрещено'
                            archive_url:
                                type:
                                    - string
                                    - 'null'
                                format: uri
                                description: 'Просмотр содержимого zip, у остальных файлов null'
                links:
                    type: array
                    description: 'Внешние ссылки на скачивание'
                    items:
                        type: object
                        properties:
                            name: { type: string }
                            download_url:
                                type:
                                    - string
                                    - 'null'
                                format: uri
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Article:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                slug:
                    type: string
                    description: 'Слаг из ссылки, начинается с id'
                category_id:
                    type: integer
                category:
                    $ref: '#/components/schemas/Category'
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                visits:
                    type: integer
                comments_count:
                    type: integer
                tags:
                    type: array
                    items:
                        type: object
                        properties:
                            name: { type: string }
                            url: { type: string, format: uri }
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        News:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                closed:
                    type: boolean
                    description: 'Комментирование закрыто'
                top:
                    type: boolean
                    description: 'Закреплена вверху списка'
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Offer:
            type: object
            properties:
                id:
                    type: integer
                type:
                    type: string
                    enum:
                        - offer
                        - issue
                status:
                    type: string
                    enum:
                        - wait
                        - process
                        - done
                        - cancel
                title:
                    type: string
                text:
                    type: string
                url:
                    type: string
                    format: uri
                breadcrumbs:
                    type: array
                    items:
                        type: object
                        properties:
                            title: { type: string }
                            url: { type: string, format: uri }
                rating:
                    type: integer
                vote:
                    type: object
                    properties:
                        type: { type: string }
                        id: { type: integer }
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                        own: { type: boolean }
                closed:
                    type: boolean
                comments_count:
                    type: integer
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
                reply:
                    type:
                        - object
                        - 'null'
                    description: 'Официальный ответ администрации, null — ответа ещё нет'
                    properties:
                        text: { type: string }
                        user: { $ref: '#/components/schemas/Author' }
                        answered_at: { type: string, format: date-time }
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
        Author:
            type: object
            description: 'Автор записи в списках — подписи хватает аватара и ника'
            properties:
                login:
                    type: string
                name:
                    type:
                        - string
                        - 'null'
                level:
                    type: string
                color:
                    type:
                        - string
                        - 'null'
                    description: 'Цвет ника'
                avatar:
                    type:
                        - string
                        - 'null'
                    format: uri
                status:
                    type:
                        - string
                        - 'null'
                    description: 'HTML статуса пользователя'
        User:
            type: object
            properties:
                login:
                    type: string
                name:
                    type: string
                level:
                    type: string
                country:
                    type:
                        - string
                        - null
                city:
                    type:
                        - string
                        - null
                info:
                    type:
                        - string
                        - null
                site:
                    type:
                        - string
                        - null
                gender:
                    type:
                        - string
                        - null
                birthday:
                    type:
                        - string
                        - null
                themes:
                    type: string
                point:
                    type: integer
                money:
                    type: integer
                status:
                    type:
                        - string
                        - null
                color:
                    type:
                        - string
                        - null
                avatar:
                    type:
                        - string
                        - null
                    format: uri
                picture:
                    type:
                        - string
                        - null
                    format: uri
                rating:
                    type: integer
                language:
                    type: string
                timezone:
                    type: string
                lastlogin:
                    type:
                        - string
                        - null
                    format: date-time
        Dialogue:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                    description: 'Логин собеседника'
                name:
                    type: string
                    description: 'Имя собеседника'
                text:
                    type: string
                    description: 'Текст последнего сообщения'
                type:
                    type: string
                    enum:
                        - in
                        - out
                    description: 'Направление: in — входящее, out — исходящее'
                all_reading:
                    type: boolean
                    description: 'Все сообщения в диалоге прочитаны'
                recipient_read:
                    type: boolean
                    description: 'Получатель прочитал последнее сообщение'
                can_reply:
                    type: boolean
                    description: 'Можно ли ответить (false для системных сообщений)'
                created_at:
                    type: string
                    format: date-time
                    description: 'Дата последнего сообщения'
        Message:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                    description: 'Логин отправителя'
                name:
                    type: string
                    description: 'Имя отправителя'
                text:
                    type: string
                type:
                    type: string
                    enum:
                        - in
                        - out
                    description: 'Направление: in — входящее, out — исходящее'
                recipient_read:
                    type: boolean
                    description: 'Получатель прочитал это сообщение'
                created_at:
                    type: string
                    format: date-time
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
        Forum:
            type: object
            properties:
                id:
                    type: integer
                parent_id:
                    type: integer
                    description: 'ID родительского раздела (0 — корневой)'
                parent:
                    description: 'Родительский раздел, приходит только когда связь загружена; null у корневых'
                    oneOf:
                        -
                            $ref: '#/components/schemas/Forum'
                        -
                            type: 'null'
                sort:
                    type: integer
                    description: 'Порядок сортировки'
                title:
                    type: string
                    description: 'Название форума'
                description:
                    type:
                        - string
                        - null
                    description: 'Короткое описание форума'
                closed:
                    type: boolean
                    description: 'Раздел закрыт для новых тем'
                count_topics:
                    type: integer
                count_posts:
                    type: integer
                last_topic_id:
                    type:
                        - integer
                        - null
                last_topic_title:
                    type:
                        - string
                        - null
                last_post_user_login:
                    type:
                        - string
                        - null
                last_post_user_name:
                    type:
                        - string
                        - null
                last_post_at:
                    type:
                        - string
                        - null
                    format: date-time
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/Forum'
                    description: 'Вложенные подразделы'
        Topic:
            type: object
            properties:
                id:
                    type: integer
                forum_id:
                    type: integer
                    description: 'ID раздела, в котором лежит тема'
                forum:
                    description: 'Раздел темы, приходит в GET /topics/{id} (в списке тем раздела не дублируется)'
                    oneOf:
                        -
                            $ref: '#/components/schemas/Forum'
                        -
                            type: 'null'
                title:
                    type: string
                login:
                    type: string
                name:
                    type: string
                closed:
                    type: integer
                    description: 'Тема закрыта'
                locked:
                    type: integer
                    description: 'Тема закреплена вверху'
                count_posts:
                    type: integer
                visits:
                    type: integer
                moderators:
                    type:
                        - string
                        - null
                    description: 'Список модераторов темы'
                note:
                    type:
                        - string
                        - null
                    description: 'Примечание модератора'
                last_post_id:
                    type:
                        - integer
                        - null
                last_post_user_login:
                    type:
                        - string
                        - null
                last_post_user_name:
                    type:
                        - string
                        - null
                close_user_id:
                    type:
                        - integer
                        - null
                    description: 'ID пользователя, закрывшего тему'
                updated_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
        Post:
            type: object
            properties:
                id:
                    type: integer
                login:
                    type: string
                text:
                    type: string
                rating:
                    type: integer
                updated_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/File'
        NewMessage:
            type: object
            properties:
                login:
                    type: string
                name:
                    type: string
                count:
                    type: integer
                    description: 'Количество непрочитанных сообщений от этого пользователя'
                last_message_at:
                    type: string
                    format: date-time
        File:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                path:
                    type: string
                    format: uri
                size:
                    type: integer
                extension:
                    type: string
                mime_type:
                    type: string
                is_image:
                    type: boolean
                is_audio:
                    type: boolean
                is_video:
                    type: boolean
        FeedItem:
            type: object
            properties:
                type:
                    type: string
                    description: 'Тип записи (comments, news, topics, articles и т.д.)'
                id:
                    type: integer
                section:
                    type:
                        - string
                        - 'null'
                    description: 'Название раздела'
                title:
                    type:
                        - string
                        - 'null'
                url:
                    type:
                        - string
                        - 'null'
                    format: uri
                breadcrumbs:
                    type: array
                    description: 'Путь до записи от корня раздела, пустой массив — раздел не указан'
                    items:
                        type: object
                        properties:
                            title:
                                type: string
                            url:
                                type: string
                                format: uri
                text:
                    type:
                        - string
                        - 'null'
                    description: 'HTML текста записи'
                rating:
                    type:
                        - integer
                        - 'null'
                vote:
                    type:
                        - object
                        - 'null'
                    description: 'Цель голосования, null — тип не поддерживает рейтинг'
                    properties:
                        type:
                            type: string
                            description: 'Тип для POST /rating (у темы форума — последнее сообщение)'
                        id:
                            type: integer
                        value:
                            type:
                                - string
                                - 'null'
                            enum:
                                - +
                                - '-'
                                - null
                            description: 'Голос текущего пользователя, null без токена или если не голосовал'
                        own:
                            type: boolean
                            description: 'Своя запись — голосовать нельзя'
                comments_count:
                    type:
                        - integer
                        - 'null'
                user:
                    $ref: '#/components/schemas/Author'
                media:
                    type: array
                    description: 'Картинки и видео для галереи, кроме вставленных в текст'
                    items:
                        $ref: '#/components/schemas/File'
                files:
                    type: array
                    description: 'Остальные вложения — документы, архивы, аудио'
                    items:
                        $ref: '#/components/schemas/File'
                created_at:
                    type: string
                    format: date-time
                relate:
                    type: object
                    description: 'Только при type=comments: запись, к которой оставлен комментарий'
                    properties:
                        type:
                            type: string
                        id:
                            type: integer
                        title:
                            type:
                                - string
                                - 'null'
                        url:
                            type:
                                - string
                                - 'null'
                            format: uri
                price:
                    type:
                        - number
                        - 'null'
                    description: 'Только при type=items (объявления): цена, валюта — в настройке currency'
                phone:
                    type:
                        - string
                        - 'null'
                    description: 'Только при type=items (объявления): телефон продавца'
                offer_type:
                    type: string
                    enum:
                        - offer
                        - issue
                    description: 'Только при type=offers: предложение или проблема'
                status:
                    type: string
                    enum:
                        - wait
                        - process
                        - done
                        - cancel
                    description: 'Только при type=offers: статус обработки'
            additionalProperties: true
            description: |
                Набор полей зависит от type: базовые поля приходят всегда, дополнительные — только у своего типа записи
                (relate у комментариев, price и phone у объявлений, offer_type и status у предложений).
                Сторонний модуль может добавить собственные поля, поэтому неизвестные ключи игнорируйте, а не считайте ошибкой.
        PaginationLinks:
            type: object
            properties:
                first:
                    type: string
                    format: uri
                last:
                    type: string
                    format: uri
                prev:
                    type:
                        - string
                        - null
                    format: uri
                next:
                    type:
                        - string
                        - null
                    format: uri
        SimplePaginationLinks:
            type: object
            description: 'last всегда null — общее число страниц не вычисляется'
            properties:
                first:
                    type: string
                    format: uri
                last:
                    type: 'null'
                prev:
                    type:
                        - string
                        - 'null'
                    format: uri
                next:
                    type:
                        - string
                        - 'null'
                    format: uri
        SimplePaginationMeta:
            type: object
            description: 'Упрощённая пагинация: общее число записей не считается, следующая страница определяется по links.next'
            properties:
                current_page:
                    type: integer
                current_page_url:
                    type: string
                    format: uri
                from:
                    type:
                        - integer
                        - 'null'
                path:
                    type: string
                    format: uri
                per_page:
                    type: integer
                to:
                    type:
                        - integer
                        - 'null'
        PaginationMeta:
            type: object
            properties:
                current_page:
                    type: integer
                from:
                    type:
                        - integer
                        - null
                last_page:
                    type: integer
                per_page:
                    type: integer
                to:
                    type:
                        - integer
                        - null
                total:
                    type: integer
paths:
    /auth:
        post:
            tags:
                - Авторизация
            summary: 'Получить API-токен'
            operationId: auth
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - login
                                - password
                            properties:
                                login:
                                    type: string
                                    description: 'Логин или email'
                                password:
                                    type: string
                                    format: password
                                    description: Пароль
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    token:
                                        type: string
                                        description: 'API-токен для использования в заголовке Authorization: Bearer {token}'
                401:
                    description: 'Неверный логин или пароль'
                403:
                    description: 'Пользователь заблокирован'
                422:
                    description: 'Ошибка валидации'
                429:
                    description: 'Превышен лимит попыток авторизации (10 в минуту с одного ip)'
    /feed:
        get:
            tags:
                - Лента
            summary: 'Лента последних записей сайта'
            description: 'Токен не обязателен. С токеном в каждом элементе приходит голос текущего пользователя (vote.value)'
            operationId: getFeed
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    $ref: '#/components/parameters/Page'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/FeedItem'
                                    links:
                                        $ref: '#/components/schemas/SimplePaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/SimplePaginationMeta'
                429:
                    description: 'Превышен общий лимит запросов'
    /rating:
        post:
            tags:
                - Голосование
            summary: 'Проголосовать за запись или комментарий'
            description: |
                Общий эндпоинт для всех разделов: тип и id берутся из поля vote любой записи или комментария —
                элемента ленты, записи раздела, поста форума. Требует токен.

                За свои записи голосовать нельзя, повторный голос в ту же сторону не проходит,
                голос в другую сторону отменяет предыдущий.
            operationId: rating
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - type
                                - id
                                - vote
                            properties:
                                type:
                                    type: string
                                    description: 'Тип записи — vote.type из ответа любого раздела'
                                id:
                                    type: integer
                                    description: 'Id записи — vote.id из ответа любого раздела'
                                vote:
                                    type: string
                                    enum:
                                        - +
                                        - '-'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    cancel:
                                        type: boolean
                                        description: 'Голос был отменён (повторное голосование в другую сторону)'
                                    rating:
                                        type: integer
                                        description: 'Рейтинг записи после голосования'
                400:
                    description: 'Токен не передан'
                401:
                    description: 'Неверный токен'
                422:
                    description: 'Голос не принят (свой пост, неверный тип или запись не найдена)'
                429:
                    description: 'Превышен общий лимит запросов'
    /config:
        get:
            tags:
                - Конфигурация
            summary: 'Настройки загрузки файлов и лимиты текста'
            operationId: getConfig
            security: []
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    site:
                                        type: object
                                        properties:
                                            title:
                                                type: string
                                                description: 'Название сайта'
                                            language:
                                                type: string
                                                description: 'Язык по умолчанию'
                                            money_name:
                                                type: string
                                                description: 'Название внутренней валюты'
                                            score_name:
                                                type: string
                                                description: 'Название баллов'
                                            site_closed:
                                                type: boolean
                                                description: 'Сайт закрыт для гостей'
                                            registration_open:
                                                type: boolean
                                                description: 'Регистрация открыта'
                                            invite_only:
                                                type: boolean
                                                description: 'Регистрация только по инвайтам'
                                    upload:
                                        type: object
                                        properties:
                                            max_files:
                                                type: integer
                                                description: 'Максимальное количество файлов за раз'
                                            max_file_size:
                                                type: integer
                                                description: 'Максимальный размер файла в килобайтах'
                                            extensions:
                                                type: array
                                                items:
                                                    type: string
                                                description: 'Разрешённые расширения файлов'
                                    forum:
                                        type: object
                                        properties:
                                            title_min:
                                                type: integer
                                                description: 'Минимальная длина названия темы'
                                            title_max:
                                                type: integer
                                                description: 'Максимальная длина названия темы'
                                            text_min:
                                                type: integer
                                                description: 'Минимальная длина текста поста'
                                            text_max:
                                                type: integer
                                                description: 'Максимальная длина текста поста'
                                    vote:
                                        type: object
                                        properties:
                                            title_min:
                                                type: integer
                                                description: 'Минимальная длина вопроса голосования'
                                            title_max:
                                                type: integer
                                                description: 'Максимальная длина вопроса голосования'
                                            answer_min:
                                                type: integer
                                                description: 'Минимальная длина варианта ответа'
                                            answer_max:
                                                type: integer
                                                description: 'Максимальная длина варианта ответа'
                                            answers_min:
                                                type: integer
                                                description: 'Минимальное количество вариантов'
                                            answers_max:
                                                type: integer
                                                description: 'Максимальное количество вариантов'
                                    message:
                                        type: object
                                        properties:
                                            text_min:
                                                type: integer
                                                description: 'Минимальная длина текста сообщения'
                                            text_max:
                                                type: integer
                                                description: 'Максимальная длина текста сообщения'
    /user:
        get:
            tags:
                - Пользователи
            summary: 'Профиль текущего пользователя'
            operationId: getUser
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/UserProfile' }
                400:
                    description: 'Api token missing'
                401:
                    description: Unauthorized
    '/users/{login}':
        get:
            tags:
                - Пользователи
            summary: 'Профиль пользователя по логину'
            operationId: getUserByLogin
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/User' }
                404:
                    description: 'Пользователь не найден'
    /dialogues:
        get:
            tags:
                - Сообщения
            summary: 'Список диалогов'
            operationId: getDialogues
            parameters:
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Dialogue' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
    '/talk/{login}':
        get:
            tags:
                - Сообщения
            summary: 'Переписка с пользователем'
            operationId: getTalk
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Message' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
                                    dialogue: { $ref: '#/components/schemas/Dialogue' }
                404:
                    description: 'Пользователь не найден'
        post:
            tags:
                - Сообщения
            summary: 'Отправить сообщение пользователю'
            operationId: createTalk
            parameters:
                -
                    name: login
                    in: path
                    required: true
                    schema:
                        type: string
                        pattern: '^[\w\-]+$'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - text
                            properties:
                                text:
                                    type: string
                                    description: 'Текст сообщения'
                                'files[]':
                                    type: array
                                    items: { type: string, format: binary }
                                    description: 'Прикреплённые файлы (необязательно)'
            responses:
                201:
                    description: 'Сообщение отправлено'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    data: { $ref: '#/components/schemas/Message' }
                404:
                    description: 'Пользователь не найден'
                422:
                    description: 'Ошибка валидации (флуд, игнор-лист, нельзя себе)'
    /messages/new:
        get:
            tags:
                - Сообщения
            summary: 'Новые непрочитанные сообщения'
            operationId: getNewMessages
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    count: { type: integer, description: 'Общее количество непрочитанных сообщений' }
                                    dialogues: { type: array, items: { $ref: '#/components/schemas/NewMessage' } }
                400:
                    description: 'Api token missing'
                401:
                    description: Unauthorized
    /forums:
        get:
            tags:
                - Форум
            summary: 'Разделы форума'
            operationId: getForumCategories
            security:
                -
                    BearerToken: {  }
                - {}
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Forum' } }
    '/forums/{id}':
        get:
            tags:
                - Форум
            summary: 'Темы форума'
            operationId: getForumTopics
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Topic' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
                                    forum: { $ref: '#/components/schemas/Forum' }
                404:
                    description: 'Форум не найден'
        post:
            tags:
                - Форум
            summary: 'Создать тему в разделе форума'
            operationId: createTopic
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - title
                                - text
                            properties:
                                title:
                                    type: string
                                    description: 'Название темы'
                                text:
                                    type: string
                                    description: 'Текст сообщения'
                                question:
                                    type: string
                                    description: 'Вопрос голосования (необязательно)'
                                'answers[]':
                                    type: array
                                    items: { type: string }
                                    description: 'Варианты ответов голосования (минимум 2, максимум 10)'
                                'files[]':
                                    type: array
                                    items: { type: string, format: binary }
                                    description: 'Прикреплённые файлы (необязательно)'
            responses:
                201:
                    description: 'Тема создана'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    topic: { $ref: '#/components/schemas/Topic' }
                404:
                    description: 'Форум не найден'
                422:
                    description: 'Ошибка валидации (форум закрыт, флуд, неверная длина)'
    '/topics/{id}':
        get:
            tags:
                - Форум
            summary: 'Посты темы'
            operationId: getTopicPosts
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Post' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
                                    topic: { $ref: '#/components/schemas/Topic' }
                404:
                    description: 'Тема не найдена'
        post:
            tags:
                - Форум
            summary: 'Создать пост в теме'
            operationId: createPost
            parameters:
                -
                    name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - text
                            properties:
                                text:
                                    type: string
                                    description: 'Текст поста'
                                'files[]':
                                    type: array
                                    items: { type: string, format: binary }
                                    description: 'Прикреплённые файлы (необязательно)'
            responses:
                201:
                    description: 'Пост создан'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    post: { $ref: '#/components/schemas/Post' }
                404:
                    description: 'Тема не найдена'
                422:
                    description: 'Ошибка валидации (тема закрыта, флуд, повтор текста)'
    /offers:
        get:
            tags:
                - 'Предложения и проблемы'
            summary: 'Список предложений или проблем'
            operationId: getOffers
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    name: type
                    in: query
                    description: 'Раздел: предложения или проблемы'
                    schema:
                        type: string
                        enum:
                            - offer
                            - issue
                        default: offer
                -
                    $ref: '#/components/parameters/Sort'
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
    /news:
        get:
            tags:
                - Новости
            summary: 'Список новостей'
            operationId: getNewsList
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/News' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
    /articles:
        get:
            tags:
                - Блоги
            summary: 'Список статей'
            description: 'Без category_id приходят статьи всех категорий'
            operationId: getArticles
            security:
                -
                    BearerToken: {  }
                - {}
            parameters:
                -
                    $ref: '#/components/parameters/CategoryId'
                -
                    $ref: '#/components/parameters/Sort'
                -
                    $ref: '#/components/parameters/PerPage'
                -
                    $ref: '#/components/parameters/Page'
                -
                    $ref: '#/components/parameters/Order'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Article' } }
                                    links: { $ref: '#/components/schemas/PaginationLinks' }
                                    meta: { $ref: '#/components/schemas/PaginationMeta' }
    /blogs:
        get:
            tags:
                - Блоги
            summary: 'Категории блогов'
            operationId: getBlogCategories
            security:
                -
                    BearerToken: {  }
                - {}
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/Category' } }
    /downs:
        get:
            tags:
                - Загрузки
